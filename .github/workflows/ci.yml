# ============================================================
# CI DE ACADEMIX
# ============================================================
# Yo corro esto en cada push y en cada Pull Request. Si algo no
# compila o un test falla, GitHub me lo marca en rojo antes de que
# eso llegue a producción (Vercel / Render).
#
# Dos trabajos independientes (frontend y backend) que corren en
# paralelo.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si hago varios push seguidos, cancelo los builds viejos y dejo solo el último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build (incluye chequeo de tipos)
        run: npm run build

  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        # El postinstall corre "prisma generate" (no necesita base de datos).
        run: npm ci

      - name: Chequeo de tipos
        run: npm run type-check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
