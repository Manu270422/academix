<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cargo la fuente Inter desde Google Fonts.
         Es la tipografia que defini en tailwind.config.js.
         Uso preconnect para acelerar la carga. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Script oficial de Google Identity Services. Lo necesito para
         que el boton de "Continuar con Google" funcione (ver
         components/auth/BotonGoogle.tsx). Es gratis, de Google. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <title>Academix - Tu Gestor Academico</title>
    <meta name="description" content="Organiza tus materias, tareas y fechas de entrega en un solo lugar." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
